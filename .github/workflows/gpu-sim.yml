name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs
# the CPU reference tests and the GPU smoke tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing (GH200) and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "include/**"
      - "common/**"
      - "tests/**"
      - "examples/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install NumPy
        run: python3 -m pip install --user numpy || sudo apt-get install -y python3-numpy

      # The simulator needs a shared CUDA runtime. CMakeLists.txt sets
      # CUDA_RUNTIME_LIBRARY per target to Static on non-MSVC, which overrides
      # CMAKE_CUDA_RUNTIME_LIBRARY, so switch that one line. 90-virtual embeds
      # PTX only, which is what the simulator runs.
      - name: Configure
        run: |
          sed -i 's/set(PF_CUDA_RUNTIME Static)/set(PF_CUDA_RUNTIME Shared)/' CMakeLists.txt
          grep -q 'set(PF_CUDA_RUNTIME Shared)' CMakeLists.txt
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DBUILD_TESTING=ON \
            -DPF_ENABLE_GPU_TESTS=ON

      - name: Build
        run: cmake --build build -j3

      # Fails if ctest fails, if no tests ran, or if the summary line is missing.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error | tee ctest.log
          grep -q "100% tests passed" ctest.log
